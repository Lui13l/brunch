# Backend de Brunch & Co. en Render (Blueprint). Va aparte de Vercel porque el
# WebSocket (/ws) necesita un servidor siempre encendido y una sola instancia:
# las suscripciones viven en memoria. Los secretos (sync: false) se escriben en
# el panel de Render al crear el Blueprint; nunca en este archivo.
services:
  - type: web
    name: brunch-api
    runtime: node
    rootDir: backend
    plan: free
    # Sin dependencias de desarrollo: mongodb-memory-server descargaría ~1,3 GB.
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /
    numInstances: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: MONGOMS_DISABLE_POSTINSTALL
        value: "1"
      - key: TRUST_PROXY
        value: "1"
      - key: ZONA_HORARIA
        value: America/Bogota
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      # Las direcciones de Vercel de la web y de la app del personal, separadas por coma.
      - key: CORS_ORIGIN
        sync: false
      - key: GMAIL_USUARIO
        sync: false
      - key: GMAIL_CLAVE_APP
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: CORREO_REMITENTE
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
