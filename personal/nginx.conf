server {
    listen 80;
    root /usr/share/nginx/html;

    # Las fotos subidas llegan como cuerpo binario de hasta 1 MB.
    client_max_body_size 2m;

    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # El WebSocket necesita pasar la cabecera Upgrade. El Origin del navegador
    # llega intacto: el backend lo compara con WS_ORIGINS o CORS_ORIGIN.
    location /ws {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Cocina y salón pueden pasar ratos largos sin mensajes.
        proxy_read_timeout 1h;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
