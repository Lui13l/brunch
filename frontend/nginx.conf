server {
    listen 80;
    root /usr/share/nginx/html;

    # El botón de Google abre una ventana emergente que necesita hablar con esta página.
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

    # Las fotos subidas llegan como cuerpo binario de hasta 1 MB.
    client_max_body_size 2m;

    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite pone un hash en el nombre de cada archivo: se pueden guardar para siempre.
    location /assets/ {
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Las rutas de React (/menu, /admin…) no son archivos: todas cargan index.html.
    # Sin "$uri/": /menu chocaría con la carpeta public/menu de las fotos.
    location / {
        try_files $uri /index.html;
    }
}
